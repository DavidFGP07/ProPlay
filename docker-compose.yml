services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: proplay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proplay
      POSTGRES_PASSWORD: proplay
      POSTGRES_DB: proplay
    ports:
      - "5432:5432"
    volumes:
      - proplay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proplay -d proplay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: proplay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - proplay-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  proplay-postgres-data:
  proplay-redis-data:
